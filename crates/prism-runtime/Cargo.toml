[package]
name = "prism-runtime"
description = "Stateless deterministic execution boundary for Prism"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
test-provider = ["dep:prism-testkit"]

[dependencies]
prism-core = { path = "../prism-core" }
prism-protocol = { path = "../prism-protocol" }
prism-provider = { path = "../prism-provider" }
prism-testkit = { path = "../prism-testkit", optional = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
prism-testkit = { path = "../prism-testkit" }
